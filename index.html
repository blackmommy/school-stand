<!DOCTYPE html>
<html lang="ru">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Исторический стенд • Аудиогид</title>
  <style>
    :root {
      --primary: #8b0000;
      --gold: #d4af37;
      --dark: #1f2421;
      --bg: #f8f6f0;
      --card-bg: #ffffff;
      --text: #2c3e50;
    }

    * { box-sizing: border-box; margin: 0; padding: 0; }
    body {
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Arial, sans-serif;
      background: var(--bg);
      color: var(--text);
      min-height: 100vh;
      display: flex;
      flex-direction: column;
      align-items: center;
      padding: 15px;
    }

    .container {
      max-width: 550px;
      width: 100%;
      background: var(--card-bg);
      border-radius: 16px;
      box-shadow: 0 10px 25px rgba(0,0,0,0.08);
      border: 1px solid rgba(212, 175, 55, 0.35);
      overflow: hidden;
      margin-bottom: 20px;
    }

    header {
      background: linear-gradient(135deg, #700000, #9b111e);
      color: #fff;
      padding: 22px 18px;
      text-align: center;
      border-bottom: 4px solid var(--gold);
    }

    header h1 {
      font-size: 20px;
      font-weight: 700;
      margin-bottom: 6px;
    }

    .badge-author {
      display: inline-block;
      background: rgba(255,255,255,0.18);
      border: 1px solid var(--gold);
      color: #fff;
      padding: 4px 14px;
      border-radius: 20px;
      font-size: 13px;
    }

    .content-area {
      padding: 22px 18px;
      text-align: center;
    }

    .leader-years {
      font-size: 14px;
      font-weight: 700;
      color: var(--primary);
      text-transform: uppercase;
      letter-spacing: 1px;
      margin-bottom: 6px;
    }

    .leader-name {
      font-size: 24px;
      font-weight: 800;
      color: var(--dark);
      margin-bottom: 16px;
    }

    .audio-box {
      background: #fdfaf2;
      border: 1px solid var(--gold);
      border-radius: 12px;
      padding: 14px;
      margin-bottom: 18px;
      display: flex;
      align-items: center;
      justify-content: center;
      gap: 12px;
      font-size: 14px;
      color: #5c4300;
    }

    .wave {
      display: inline-flex;
      align-items: flex-end;
      gap: 3px;
      height: 18px;
    }
    .wave span {
      width: 4px;
      background: var(--primary);
      border-radius: 2px;
      animation: sound-wave 0.8s infinite alternate ease-in-out;
    }
    .wave span:nth-child(2) { animation-delay: 0.2s; height: 100%; }
    .wave span:nth-child(1), .wave span:nth-child(3) { height: 60%; }
    .wave.paused span { animation: none; height: 4px; }

    @keyframes sound-wave {
      0% { height: 4px; }
      100% { height: 18px; }
    }

    .bio-box {
      text-align: left;
      line-height: 1.6;
      font-size: 15px;
      background: #fbfbfb;
      padding: 16px;
      border-radius: 10px;
      border-left: 4px solid var(--primary);
      margin-bottom: 20px;
    }

    .actions {
      display: flex;
      flex-direction: column;
      gap: 10px;
    }

    .btn {
      display: inline-flex;
      align-items: center;
      justify-content: center;
      gap: 8px;
      padding: 14px 18px;
      border-radius: 10px;
      font-size: 15px;
      font-weight: 600;
      text-decoration: none;
      border: none;
      cursor: pointer;
    }

    .btn-voice { background: var(--primary); color: #fff; }
    .btn-wiki { background: #fff; color: var(--dark); border: 1px solid #ccc; }

    /* Оверлей для первого клика (разрешение звука на смартфонах) */
    .autoplay-overlay {
      position: fixed;
      inset: 0;
      background: rgba(0, 0, 0, 0.75);
      color: #fff;
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      padding: 24px;
      text-align: center;
      z-index: 9999;
      cursor: pointer;
    }
    .autoplay-overlay.hidden { display: none; }
    .autoplay-icon {
      font-size: 54px;
      margin-bottom: 16px;
      animation: bounce 1.5s infinite;
    }
    .autoplay-btn {
      margin-top: 18px;
      background: var(--gold);
      color: #000;
      font-weight: 700;
      padding: 14px 26px;
      border-radius: 30px;
      font-size: 16px;
    }
    @keyframes bounce {
      0%, 100% { transform: translateY(0); }
      50% { transform: translateY(-8px); }
    }
  </style>
</head>
<body>

  <!-- Экран автозапуска звука при переходе -->
  <div class="autoplay-overlay" id="autoplayOverlay">
    <div class="autoplay-icon">🔊</div>
    <h2>Исторический стенд</h2>
    <p style="margin-top: 8px; color: #ddd;">Нажмите в любое место, чтобы прослушать аудиогид</p>
    <div class="autoplay-btn">Включить звук</div>
  </div>

  <div class="container">
    <header>
      <h1>Школьный исторический стенд</h1>
      <span class="badge-author">Автор стенда: Лариса Николаевна</span>
    </header>

    <div class="content-area">
      <div class="leader-years" id="leaderYears">...</div>
      <h2 class="leader-name" id="leaderName">Загрузка...</h2>

      <div class="audio-box">
        <div class="wave paused" id="audioWave"><span></span><span></span><span></span></div>
        <span id="audioStatusText">Подготовка аудио...</span>
      </div>

      <div class="bio-box" id="leaderBio"></div>

      <div class="actions">
        <button class="btn btn-voice" id="playAudioBtn">🔊 Повторить озвучку</button>
        <a href="#" target="_blank" class="btn btn-wiki" id="wikiBtn">📖 Читать статью в Википедии</a>
      </div>
    </div>
  </div>

  <audio id="fallbackAudio" preload="auto"></audio>

  <script>
    const leaders = {
      lenin: {
        name: "Владимир Ильич Ленин",
        years: "1917 — 1924",
        shortBio: "Основатель Советского государства, руководитель Октябрьской революции 1917 года, первый председатель Совета Народных Комиссаров СССР.",
        voiceText: "Перед вами представлен Владимир Ильич Ленин. Основатель Советского государства, руководитель Октябрьской революции 1917 года и первый председатель Совета Народных Комиссаров СССР.",
        wiki: "https://ru.wikipedia.org/wiki/Ленин,_Владимир_Ильич"
      },
      stalin: {
        name: "Иосиф Виссарионович Сталин",
        years: "1924 — 1953",
        shortBio: "Генеральный секретарь ЦК КПСС. Руководитель государства в период индустриализации, Великой Отечественной войны и послевоенного восстановления.",
        voiceText: "Перед вами представлен Иосиф Виссарионович Сталин. Руководитель Советского Союза в период масштабной индустриализации, Великой Отечественной войны и послевоенного восстановления.",
        wiki: "https://ru.wikipedia.org/wiki/Сталин,_Иосиф_Виссарионович"
      },
      khrushchev: {
        name: "Никита Сергеевич Хрущёв",
        years: "1953 — 1964",
        shortBio: "Первый секретарь ЦК КПСС. Период его правления известен как «оттепель», освоением целины и началом космической эры человечества.",
        voiceText: "Перед вами представлен Никита Сергеевич Хрущёв. Период его руководства известен как эпоха оттепели, освоения целины и первых полётов человека в космос.",
        wiki: "https://ru.wikipedia.org/wiki/Хрущёв,_Никита_Сергеевич"
      },
      brezhnev: {
        name: "Леонид Ильич Брежнев",
        years: "1964 — 1982",
        shortBio: "Генеральный секретарь ЦК КПСС. Время его руководства характеризовалось стабильностью, масштабным строительством и укреплением оборонной мощи.",
        voiceText: "Перед вами представлен Леонид Ильич Брежнев. Руководитель Советского государства на протяжении восемнадцати лет масштабного строительства и стабильности.",
        wiki: "https://ru.wikipedia.org/wiki/Брежнев,_Леонид_Ильич"
      },
      andropov: {
        name: "Юрий Владимирович Андропов",
        years: "1982 — 1984",
        shortBio: "Генеральный секретарь ЦК КПСС. Инициировал широкую кампанию по наведению трудовой дисциплины и борьбе с коррупцией.",
        voiceText: "Перед вами представлен Юрий Владимирович Андропов. Руководитель Советского Союза, выступавший за строгую производственную дисциплину и государственные преобразования.",
        wiki: "https://ru.wikipedia.org/wiki/Андропов,_Юрий_Владимирович"
      },
      gorbachev: {
        name: "Михаил Сергеевич Горбачёв",
        years: "1985 — 1991",
        shortBio: "Последний генеральный секретарь ЦК КПСС и единственный Президент СССР. Проводил курс перестройки, гласности и демократизации общества.",
        voiceText: "Перед вами представлен Михаил Сергеевич Горбачёв. Первый и единственный Президент Советского Союза, начавший политику гласности и перестройки.",
        wiki: "https://ru.wikipedia.org/wiki/Горбачёв,_Михаил_Сергеевич"
      },
      yeltsin: {
        name: "Борис Николаевич Ельцин",
        years: "1991 — 1999",
        shortBio: "Первый Президент Российской Федерации. Руководил страной в период перехода к рыночной экономике и принятия Конституции РФ 1993 года.",
        voiceText: "Перед вами представлен Борис Николаевич Ельцин. Первый Президент Российской Федерации, руководивший страной на начальном этапе формирования нового государства.",
        wiki: "https://ru.wikipedia.org/wiki/Ельцин,_Борис_Николаевич"
      }
    };

    const urlParams = new URLSearchParams(window.location.search);
    let id = (urlParams.get('id') || 'lenin').toLowerCase();
    if (!leaders[id]) id = 'lenin';
    const leader = leaders[id];

    // Заполнение текста
    document.getElementById('leaderName').textContent = leader.name;
    document.getElementById('leaderYears').textContent = leader.years;
    document.getElementById('leaderBio').textContent = leader.shortBio;
    document.getElementById('wikiBtn').href = leader.wiki;

    const wave = document.getElementById('audioWave');
    const statusText = document.getElementById('audioStatusText');
    const fallbackAudio = document.getElementById('fallbackAudio');
    const overlay = document.getElementById('autoplayOverlay');

    // Озвучка: сначала встроенный синтез речи, при отказе — облачный аудио-поток
    function playAudio() {
      const text = leader.voiceText;

      if ('speechSynthesis' in window) {
        window.speechSynthesis.cancel();
        const utter = new SpeechSynthesisUtterance(text);
        utter.lang = 'ru-RU';
        utter.rate = 0.95;

        utter.onstart = () => {
          wave.classList.remove('paused');
          statusText.textContent = "Воспроизведение аудио...";
        };
        utter.onend = () => {
          wave.classList.add('paused');
          statusText.textContent = "Аудио завершено";
        };
        utter.onerror = () => {
          playFallbackCloud(text);
        };

        window.speechSynthesis.speak(utter);
      } else {
        playFallbackCloud(text);
      }
    }

    // Резервная облачная озвучка для старых браузеров и телефонов без синтезатора
    function playFallbackCloud(text) {
      statusText.textContent = "Воспроизведение аудио...";
      wave.classList.remove('paused');
      const url = `https://translate.google.com/translate_tts?ie=UTF-8&tl=ru&client=tw-ob&q=${encodeURIComponent(text)}`;
      fallbackAudio.src = url;
      fallbackAudio.play().then(() => {
        fallbackAudio.onended = () => {
          wave.classList.add('paused');
          statusText.textContent = "Аудио завершено";
        };
      }).catch(() => {
        wave.classList.add('paused');
        statusText.textContent = "Нажмите кнопку ниже для воспроизведения";
      });
    }

    // Запуск по нажатию на оверлей или экран
    overlay.addEventListener('click', () => {
      overlay.classList.add('hidden');
      playAudio();
    });

    document.getElementById('playAudioBtn').addEventListener('click', playAudio);

    // Попытка мгновенного воспроизведения без клика (если браузер разрешит)
    window.addEventListener('DOMContentLoaded', () => {
      try {
        playAudio();
        // Если воспроизведение началось без блокировки, скрываем оверлей
        if ('speechSynthesis' in window && window.speechSynthesis.speaking) {
          overlay.classList.add('hidden');
        }
      } catch (e) {
        // Оверлей останется видимым для одного нажатия
      }
    });
  </script>
</body>
</html>
