
<!DOCTYPE html>
<html lang="ru">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Исторический стенд • Аудиогид</title>
  <style>
    :root {
      --primary: #8b0000;
      --gold: #d4af37;
      --dark: #1f2421;
      --bg: #f8f6f0;
      --card-bg: #ffffff;
      --text: #2c3e50;
    }

    * { box-sizing: border-box; margin: 0; padding: 0; }
    body {
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Arial, sans-serif;
      background: var(--bg);
      color: var(--text);
      min-height: 100vh;
      display: flex;
      flex-direction: column;
      align-items: center;
      padding: 15px;
    }

    .container {
      max-width: 580px;
      width: 100%;
      background: var(--card-bg);
      border-radius: 16px;
      box-shadow: 0 10px 25px rgba(0,0,0,0.08);
      border: 1px solid rgba(212, 175, 55, 0.35);
      overflow: hidden;
      margin-bottom: 20px;
    }

    header {
      background: linear-gradient(135deg, #700000, #9b111e);
      color: #fff;
      padding: 20px 16px;
      text-align: center;
      border-bottom: 4px solid var(--gold);
    }

    header h1 {
      font-size: 20px;
      font-weight: 700;
      margin-bottom: 6px;
    }

    .badge-dynasty {
      display: inline-block;
      background: rgba(0,0,0,0.25);
      border: 1px solid rgba(255,255,255,0.4);
      color: #fff;
      padding: 3px 10px;
      border-radius: 12px;
      font-size: 12px;
      margin-right: 6px;
    }

    .badge-author {
      display: inline-block;
      background: rgba(255,255,255,0.18);
      border: 1px solid var(--gold);
      color: #fff;
      padding: 3px 12px;
      border-radius: 12px;
      font-size: 12px;
      font-weight: 600;
    }

    .content-area {
      padding: 22px 18px;
      text-align: center;
    }

    .leader-years {
      font-size: 14px;
      font-weight: 700;
      color: var(--primary);
      text-transform: uppercase;
      letter-spacing: 1px;
      margin-bottom: 6px;
    }

    .leader-name {
      font-size: 24px;
      font-weight: 800;
      color: var(--dark);
      margin-bottom: 16px;
      line-height: 1.25;
    }

    .audio-box {
      background: #fdfaf2;
      border: 1px solid var(--gold);
      border-radius: 12px;
      padding: 14px;
      margin-bottom: 18px;
      display: flex;
      align-items: center;
      justify-content: center;
      gap: 12px;
      font-size: 14px;
      color: #5c4300;
    }

    .wave {
      display: inline-flex;
      align-items: flex-end;
      gap: 3px;
      height: 18px;
    }
    .wave span {
      width: 4px;
      background: var(--primary);
      border-radius: 2px;
      animation: sound-wave 0.8s infinite alternate ease-in-out;
    }
    .wave span:nth-child(2) { animation-delay: 0.2s; height: 100%; }
    .wave span:nth-child(1), .wave span:nth-child(3) { height: 60%; }
    .wave.paused span { animation: none; height: 4px; }

    @keyframes sound-wave {
      0% { height: 4px; }
      100% { height: 18px; }
    }

    .bio-box {
      text-align: left;
      line-height: 1.6;
      font-size: 15px;
      background: #fbfbfb;
      padding: 16px;
      border-radius: 10px;
      border-left: 4px solid var(--primary);
      margin-bottom: 20px;
    }

    .actions {
      display: flex;
      flex-direction: column;
      gap: 10px;
    }

    .btn {
      display: inline-flex;
      align-items: center;
      justify-content: center;
      gap: 8px;
      padding: 13px 18px;
      border-radius: 10px;
      font-size: 15px;
      font-weight: 600;
      text-decoration: none;
      border: none;
      cursor: pointer;
    }

    .btn-voice { background: var(--primary); color: #fff; }
    .btn-wiki { background: #fff; color: var(--dark); border: 1px solid #ccc; }

    /* Оверлей первого клика для обхода блокировки звука мобильными браузерами */
    .autoplay-overlay {
      position: fixed;
      inset: 0;
      background: rgba(0, 0, 0, 0.82);
      color: #fff;
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      padding: 24px;
      text-align: center;
      z-index: 9999;
      cursor: pointer;
    }
    .autoplay-overlay.hidden { display: none; }
    .autoplay-icon {
      font-size: 52px;
      margin-bottom: 14px;
      animation: bounce 1.5s infinite;
    }
    .autoplay-btn {
      margin-top: 18px;
      background: var(--gold);
      color: #000;
      font-weight: 700;
      padding: 14px 28px;
      border-radius: 30px;
      font-size: 16px;
    }
    @keyframes bounce {
      0%, 100% { transform: translateY(0); }
      50% { transform: translateY(-8px); }
    }

    /* Навигация по правителям */
    .catalog-section {
      margin-top: 24px;
      border-top: 1px solid #eee;
      padding-top: 16px;
      text-align: left;
    }
    .catalog-title {
      font-size: 14px;
      color: #777;
      margin-bottom: 10px;
      text-align: center;
      font-weight: 600;
    }
    .catalog-group-name {
      font-size: 13px;
      font-weight: 700;
      color: var(--primary);
      margin: 10px 0 6px;
    }
    .chips {
      display: flex;
      flex-wrap: wrap;
      gap: 6px;
    }
    .chip {
      background: #f1f3f5;
      color: #333;
      text-decoration: none;
      font-size: 12px;
      padding: 6px 10px;
      border-radius: 6px;
      font-weight: 500;
    }
    .chip.active {
      background: var(--primary);
      color: #fff;
    }
  </style>
</head>
