<html lang="ru">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Исторический стенд • Аудиогид</title>
  <style>
    :root {
      --primary: #8b0000;
      --gold: #d4af37;
      --dark: #1f2421;
      --bg: #f8f6f0;
      --card-bg: #ffffff;
      --text: #2c3e50;
    }

    * { box-sizing: border-box; margin: 0; padding: 0; }
    body {
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Arial, sans-serif;
      background: var(--bg);
      color: var(--text);
      min-height: 100vh;
      display: flex;
      flex-direction: column;
      align-items: center;
      padding: 15px;
    }

    .container {
      max-width: 550px;
      width: 100%;
      background: var(--card-bg);
      border-radius: 16px;
      box-shadow: 0 10px 25px rgba(0,0,0,0.08);
      border: 1px solid rgba(212, 175, 55, 0.35);
      overflow: hidden;
      margin-bottom: 20px;
    }

    header {
      background: linear-gradient(135deg, #700000, #9b111e);
      color: #fff;
      padding: 22px 18px;
      text-align: center;
      border-bottom: 4px solid var(--gold);
    }

    header h1 {
      font-size: 20px;
      font-weight: 700;
      margin-bottom: 6px;
    }

    .badge-dynasty {
      display: inline-block;
      background: rgba(0,0,0,0.25);
      border: 1px solid rgba(255,255,255,0.4);
      color: #fff;
      padding: 3px 10px;
      border-radius: 12px;
      font-size: 12px;
      margin-right: 6px;
    }

    .badge-author {
      display: inline-block;
      background: rgba(255,255,255,0.18);
      border: 1px solid var(--gold);
      color: #fff;
      padding: 3px 12px;
      border-radius: 12px;
      font-size: 12px;
      font-weight: 600;
    }

    .content-area {
      padding: 22px 18px;
      text-align: center;
    }

    .leader-years {
      font-size: 14px;
      font-weight: 700;
      color: var(--primary);
      text-transform: uppercase;
      letter-spacing: 1px;
      margin-bottom: 6px;
    }

    .leader-name {
      font-size: 24px;
      font-weight: 800;
      color: var(--dark);
      margin-bottom: 16px;
      line-height: 1.25;
    }

    .audio-box {
      background: #fdfaf2;
      border: 1px solid var(--gold);
      border-radius: 12px;
      padding: 14px;
      margin-bottom: 18px;
      display: flex;
      align-items: center;
      justify-content: center;
      gap: 12px;
      font-size: 14px;
      color: #5c4300;
    }

    .wave {
      display: inline-flex;
      align-items: flex-end;
      gap: 3px;
      height: 18px;
    }
    .wave span {
      width: 4px;
      background: var(--primary);
      border-radius: 2px;
      animation: sound-wave 0.8s infinite alternate ease-in-out;
    }
    .wave span:nth-child(2) { animation-delay: 0.2s; height: 100%; }
    .wave span:nth-child(1), .wave span:nth-child(3) { height: 60%; }
    .wave.paused span { animation: none; height: 4px; }

    @keyframes sound-wave {
      0% { height: 4px; }
      100% { height: 18px; }
    }

    .bio-box {
      text-align: left;
      line-height: 1.6;
      font-size: 15px;
      background: #fbfbfb;
      padding: 16px;
      border-radius: 10px;
      border-left: 4px solid var(--primary);
      margin-bottom: 20px;
    }

    .actions {
      display: flex;
      flex-direction: column;
      gap: 10px;
    }

    .btn {
      display: inline-flex;
      align-items: center;
      justify-content: center;
      gap: 8px;
      padding: 14px 18px;
      border-radius: 10px;
      font-size: 15px;
      font-weight: 600;
      text-decoration: none;
      border: none;
      cursor: pointer;
    }

    .btn-voice { background: var(--primary); color: #fff; }
    .btn-wiki { background: #fff; color: var(--dark); border: 1px solid #ccc; }

    /* Полноэкранный оверлей для надёжного запуска звука в 1 клик */
    .autoplay-overlay {
      position: fixed;
      inset: 0;
      background: rgba(0, 0, 0, 0.78);
      color: #fff;
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      padding: 24px;
      text-align: center;
      z-index: 9999;
      cursor: pointer;
    }
    .autoplay-overlay.hidden { display: none; }
    .autoplay-icon {
      font-size: 54px;
      margin-bottom: 16px;
    }
    .autoplay-btn {
      margin-top: 18px;
      background: var(--gold);
      color: #000;
      font-weight: 700;
      padding: 14px 26px;
      border-radius: 30px;
      font-size: 16px;
    }
  </style>
</head>

  <!-- Нажатие в любое место сразу снимает экран и запускает озвучку -->
  <div class="autoplay-overlay" id="autoplayOverlay">

        voiceText: "Перед вами представлен Леонид Ильич Брежнев. Руководитель страны периода масштабного строительства и стабильности.",
        wiki: "https://ru.wikipedia.org/wiki/Брежнев,_Леонид_Ильич"
      },
      andropov: {
        dynasty: "СССР и РФ",
        name: "Юрий Владимирович Андропов",
        years: "1982 — 1984",
        shortBio: "Генеральный секретарь ЦК КПСС. Инициировал широкую кампанию по укреплению производственной дисциплины.",
        voiceText: "Перед вами представлен Юрий Владимирович Андропов. Руководитель страны, выступавший за строгую производственную дисциплину.",
        wiki: "https://ru.wikipedia.org/wiki/Андропов,_Юрий_Владимирович"
      },
      gorbachev: {
        dynasty: "СССР и РФ",
        name: "Михаил Сергеевич Горбачёв",
        years: "1985 — 1991",
        shortBio: "Последний генеральный секретарь ЦК КПСС и единственный Президент СССР. Начал политику гласности и перестройки.",
        voiceText: "Перед вами представлен Михаил Сергеевич Горбачёв. Первый и единственный Президент СССР, провозгласивший перестройку.",
        wiki: "https://ru.wikipedia.org/wiki/Горбачёв,_Михаил_Сергеевич"
      },
      yeltsin: {
        dynasty: "СССР и РФ",
        name: "Борис Николаевич Ельцин",
        years: "1991 — 1999",
        shortBio: "Первый Президент Российской Федерации, руководивший страной на начальном этапе формирования нового государства.",
        voiceText: "Перед вами представлен Борис Николаевич Ельцин. Первый Президент Российской Федерации.",
        wiki: "https://ru.wikipedia.org/wiki/Ельцин,_Борис_Николаевич"
      }
    };

    // БОЛЬШОЙ СЛОВАРЬ СИНОНИМОВ (любые варианты написания распознаются корректно)
    const aliases = {
      // Романовы
      'alexey_mikhailovich': 'aleksey',
      'aleksey_mikhaylovich': 'aleksey',
      'alexey': 'aleksey',
      'алексей_михайлович': 'aleksey',
      'mikhail_fedorovich': 'mikhail',
      'mikhail_fyodorovich': 'mikhail',
      'михаил_федорович': 'mikhail',
      'peter_1': 'peter_1',
      'peter1': 'peter_1',
      'petr_1': 'peter_1',

      'елизавета_петровна': 'elizaveta',
      'ekaterina_2': 'ekaterina_2',
      'ekaterina2': 'ekaterina_2',
      'екатерина_2': 'ekaterina_2',
      'alexander_1': 'alexander_1',
      'alexander1': 'alexander_1',
      'александр_1': 'alexander_1',
      'nikolay_1': 'nikolay_1',
      'nikolay1': 'nikolay_1',
      'николай_1': 'nikolay_1',
      'alexander_2': 'alexander_2',
      'alexander2': 'alexander_2',
      'александр_2': 'alexander_2',
      'alexander_3': 'alexander_3',
      'alexander3': 'alexander_3',
      'александр_3': 'alexander_3',
      'nikolay_2': 'nikolay_2',
      'nikolay2': 'nikolay_2',
      'николай_2': 'nikolay_2',

      // Рюриковичи
      'oleg_veshiy': 'oleg',
      'oleg_veshy': 'oleg',
      'олег_вещий': 'oleg',
      'knyaginya_olga': 'olga',
      'княгиня_ольга': 'olga',
      'vladimir': 'vladimir_1',
      'vladimir_svyatoslavich': 'vladimir_1',
      'владимир_святославич': 'vladimir_1',
      'yaroslav_mudry': 'yaroslav',

      'ярослав_мудрый': 'yaroslav',
      'vladimir_monomakh': 'monomakh',

      'yury_dolgorukiy': 'dolgorukiy',

      'андрей_боголюбский': 'bogolyubskiy',
      'vsevolod_bolshoe_gnezdo': 'vsevolod',
      'всеволод_большое_гнездо': 'vsevolod',
      'alexander_nevsky': 'nevsky',
      'александр_невский': 'nevsky',
      'ivan_kalita': 'kalita',
      'ivan_1_kalita': 'kalita',
      'иван_калита': 'kalita',
      'dmitry_donskoy': 'donskoy',
      'dmitriy_donskoy': 'donskoy',
      'дмитрий_донской': 'donskoy',
      'ivan_3': 'ivan_3',
      'ivan3': 'ivan_3',
      'ivan_3_vasilievich': 'ivan_3',
      'иван_3': 'ivan_3',
      'ivan_grozny': 'grozny',
      'ivan_4_grozny': 'grozny',
      'иван_грозный': 'grozny',
      'boris_godunov': 'godunov',
      'борис_годунов': 'godunov',

      // Советские лидеры
      'владимир_ленин': 'lenin',
      'иосиф_сталин': 'stalin',
      'никита_хрущев': 'khrushchev',
      'леонид_брежнев': 'brezhnev',
      'юрий_андропов': 'andropov',
      'михаил_горбачев': 'gorbachev',
      'борис_ельцин': 'yeltsin'
    };

    // Чтение параметра ?id=...
    const urlParams = new URLSearchParams(window.location.search);
    let rawId = (urlParams.get('id') || 'lenin').toLowerCase().trim();

    // Преобразуем синоним, если он есть
    let id = aliases[rawId] || rawId;

    // Защита: если передан совсем неизвестный ID, только тогда открываем Ленина
    if (!leaders[id]) id = 'lenin';
    const leader = leaders[id];

    // Заполнение карточки данными
    document.getElementById('dynastyBadge').textContent = leader.dynasty;
    document.getElementById('leaderName').textContent = leader.name;
    document.getElementById('leaderYears').textContent = leader.years;
    document.getElementById('leaderBio').textContent = leader.shortBio;
    document.getElementById('wikiBtn').href = leader.wiki;
    document.getElementById('overlayName').textContent = leader.name;

    const wave = document.getElementById('audioWave');
    const statusText = document.getElementById('audioStatusText');
    const overlay = document.getElementById('autoplayOverlay');

    // Озвучка через SpeechSynthesis
    function speakText() {
      if (!('speechSynthesis' in window)) {
        statusText.textContent = "Синтез речи не поддерживается браузером";
        return;
      }
      window.speechSynthesis.cancel();

      const utter = new SpeechSynthesisUtterance(leader.voiceText);
      utter.lang = 'ru-RU';
      utter.rate = 0.95;

      utter.onstart = () => {
        wave.classList.remove('paused');
        statusText.textContent = "Воспроизведение аудио...";
      };
      utter.onend = () => {
        wave.classList.add('paused');
        statusText.textContent = "Аудио завершено. Нажмите кнопку, чтобы повторить.";
      };
      utter.onerror = () => {
        wave.classList.add('paused');
        statusText.textContent = "Нажмите кнопку повтора для воспроизведения";
      };

      window.speechSynthesis.speak(utter);
    }

    // Запуск звука при первом касании в любое место
    overlay.addEventListener('click', () => {
      overlay.classList.add('hidden');
      speakText();
    });

    document.getElementById('playAudioBtn').addEventListener('click', speakText);
  </script>
</body>
</html>
